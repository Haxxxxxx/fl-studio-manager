# Builds the desktop installers and attaches them to a draft GitHub Release:
# macOS (universal .dmg, Apple Silicon + Intel) and Windows (.exe installer,
# cross-compiled with cargo-xwin + NSIS).
#
# Runs on a self-hosted runner: the crew admin's Mac, registered for this
# repo with the label `hivo` (setup: SETUP.md → "Release builds"). It uses no
# GitHub-hosted minutes, so it's free; the Mac must be on and the runner
# service running. To go back to GitHub's machines later, restore the
# windows-latest / macos-latest matrix from git history.
#
# Run it: push a version tag (git tag v0.2.0 && git push origin v0.2.0), or
# Actions → "Release builds" → Run workflow. Then open Releases, check the
# draft, and Publish.
#
# The crew server settings (public URL + public anon key) come from the
# repository variables VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY. They're
# public by design: row-level security in the database protects the data.
#
# Hardening (this runs on a personal machine):
# - Only this repo's tags and manual runs from main start it. PR checks
#   live in ci.yml on GitHub's runners, so fork code never reaches the Mac.
# - The write token exists only in the "Draft release" step: dependency
#   install scripts and build tools never see it.
# - `npm ci --ignore-scripts`: dependency install scripts never run.
# - Actions pinned to full commit SHAs.
#
# Updates: the builds are signed with the TAURI_SIGNING_PRIVATE_KEY secret
# and uploaded, with latest.json, to the public `releases` bucket of that
# project (SUPABASE_SERVICE_ROLE_KEY secret, write-only use). The app checks
# latest.json on launch; the website's /download/* point at latest/*.
# Pushing a version tag therefore SHIPS the update: every installed app
# offers it on its next launch, before the draft GitHub Release is
# published. Only tag a commit on main that is ready for the crew.
name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Haxxxxxx/fl-studio-manager' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, macOS, hivo]
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_FEEDBACK_EMAIL: ${{ vars.VITE_FEEDBACK_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The write token isn't left in .git/config while dependency
          # install scripts run.
          persist-credentials: false

      - name: Toolchain
        run: |
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check tools
        run: |
          node -v && npm -v && cargo -V && cargo xwin --version && makensis -VERSION
          rustup target add aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc

      # A release tag must point at a commit on main, so a tag pushed from a
      # side branch can't ship unreviewed code.
      - name: Tag is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags --depth=1000 origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      # The tag must name the version in tauri.conf.json: the bucket paths,
      # latest.json and the release are all derived from that version.
      - name: Tag matches the version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME but tauri.conf.json says $version"; exit 1; }

      - run: npm ci --ignore-scripts

      - run: npm test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Both builds sign their updater artifacts (.app.tar.gz, -setup.exe)
      # with the key the app's updater verifies against (plugins.updater.pubkey
      # in tauri.conf.json). The key has no password.
      - name: macOS installer (universal)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Windows installer (cross-compiled)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build -- --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis

      # The public `releases` bucket on the crew's Supabase project: the
      # updater reads latest.json from it, the website links to latest/*.
      # The service-role key exists only in this step.
      - name: Publish to the releases bucket
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mac=src-tauri/target/universal-apple-darwin/release/bundle
          win=src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          dmg=$(ls "$mac"/dmg/*.dmg)
          app=$(ls "$mac"/macos/*.app.tar.gz)
          exe=$(ls "$win"/*-setup.exe)
          test -s "$app.sig" && test -s "$exe.sig"
          public="$SUPABASE_URL/storage/v1/object/public/releases"
          # up <bucket path> <file> <content type>
          up() {
            curl -fsS -o /dev/null -X POST "$SUPABASE_URL/storage/v1/object/releases/$1" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "x-upsert: true" \
              -H "Content-Type: $3" --data-binary "@$2"
            echo "uploaded $1"
          }
          dir="v$version"
          up "$dir/$(basename "$app")" "$app" application/gzip
          up "$dir/$(basename "$app").sig" "$app.sig" text/plain
          up "$dir/$(basename "$exe")" "$exe" application/octet-stream
          up "$dir/$(basename "$exe").sig" "$exe.sig" text/plain
          up "latest/Hivo.dmg" "$dmg" application/x-apple-diskimage
          up "latest/Hivo-setup.exe" "$exe" application/octet-stream
          # The updater manifest, last so a half-finished upload never points
          # at files that aren't there yet.
          VERSION="$version" APP_URL="$public/$dir/$(basename "$app")" APP_SIG="$(cat "$app.sig")" \
          EXE_URL="$public/$dir/$(basename "$exe")" EXE_SIG="$(cat "$exe.sig")" \
          node -e '
            const e = process.env;
            const mac = { signature: e.APP_SIG, url: e.APP_URL };
            const manifest = {
              version: e.VERSION,
              notes: `Hivo ${e.VERSION}`,
              pub_date: new Date().toISOString(),
              platforms: {
                "darwin-universal": mac,
                "darwin-aarch64": mac,
                "darwin-x86_64": mac,
                "windows-x86_64": { signature: e.EXE_SIG, url: e.EXE_URL },
              },
            };
            require("fs").writeFileSync("latest.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          up "latest.json" latest.json application/json

      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag=$([ "$REF_TYPE" = "tag" ] && echo "$REF_NAME" || echo "v$version")
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          exe=$(ls src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
          cat > release-notes.md <<'EOF'
          Desktop builds of Hivo.

          **Windows:** download the `_x64-setup.exe` and run it. If Windows shows "Windows protected your PC", click **More info → Run anyway** (the app isn't code-signed yet).

          **macOS:** download the `.dmg`, drag Hivo to Applications and open it from there (in-app updates need the app in Applications, not on the disk image). The app is signed but not notarized by Apple yet, so the first time macOS says it can't verify the developer: click **Done**, then go to **System Settings → Privacy & Security**, scroll down and click **Open Anyway** next to Hivo. If macOS ever says it's "damaged", run `xattr -cr "/Applications/Hivo.app"` in Terminal once.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$dmg" "$exe" --clobber
          else
            gh release create "$tag" "$dmg" "$exe" --draft --title "Hivo $tag" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi
          echo "Draft release $tag: $(basename "$dmg"), $(basename "$exe")"
