# Weekly update PRs (checked by ci.yml before anything merges).
# The cooldown keeps freshly published versions out for a week: hijacked
# npm releases (keyv, axios, chalk/debug) were caught and pulled within
# hours to days. Security updates are not delayed by it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Tauri plugins come in pairs (npm package + Rust crate) that must share a
    # major.minor (`npm run check:tauri`); bump them by hand, both halves at once.
    ignore:
      - dependency-name: "@tauri-apps/*"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "tauri"
      - dependency-name: "tauri-*"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
