<!doctype html>
<!--
  Wrapper for the YouTube player used by the desktop app's Digger.

  The app's webview runs on a custom origin (tauri://localhost) that sends no
  HTTP referrer, and YouTube refuses to play an embed without one ("Video
  player configuration error", error 153). Framing this page instead gives the
  inner player an https referrer. Its headers (CSP, Referrer-Policy) are set
  for this path in vercel.json. Play only: nothing is ever downloaded.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Hivo player</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #bbb;
        font: 13px/1.4 system-ui, sans-serif;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      p {
        margin: 0;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <script src="/embed.js"></script>
  </body>
</html>
