# cargo-audit settings (read from the repo root, where CI runs
# `cargo audit --file src-tauri/Cargo.lock`).

[advisories]
# zip 4.x comes in through tauri-plugin-updater (Windows target only; our own
# zip is 9.x). The three advisories are about extracting attacker-controlled
# archives (symlink targets, SUID bits). The updater only ever extracts the
# update it has just verified against our signing key, so they don't apply.
# Drop these once the updater plugin moves to zip >= 9.
ignore = ["RUSTSEC-2026-0367", "RUSTSEC-2026-0368", "RUSTSEC-2026-0369"]
