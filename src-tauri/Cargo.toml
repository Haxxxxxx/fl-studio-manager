[package]
name = "fl-studio-manager"
version = "0.2.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fl_studio_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
walkdir = "2.5.0"
trash = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Only the codecs mixdowns use (wav, mp3, ogg, flac): less decoder surface
# for files that come from crewmates.
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "adpcm", "mp3", "ogg", "vorbis", "flac"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.53.2", features = ["time"] }
base64 = "0.22"
rustfft = "6"
flate2 = "1"
quick-xml = "0.42"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# GetDriveTypeW: backups on removable/network drives skip the Recycle Bin.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
# statfs: network volumes have no Trash.
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, not abort: a panic while reading one damaged or hostile project or
# mixdown is caught (scanner.rs, audio.rs) instead of closing the app.
panic = "unwind"
strip = true
